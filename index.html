<!DOCTYPE html>
<html lang="en">

<title>Sand Sprites</title>
<style>

#fx{position:fixed;left:0;top:0;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
.btn{position:relative;width:var(--b);height:var(--b);border-radius:30%;border:none;padding:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--b)*.5);line-height:1;cursor:pointer;color:#fff;font-family:inherit;
  background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0) 48%),var(--c,linear-gradient(180deg,#d9c8ff,#9b7ff0));

  transition:transform .12s, filter .2s}

  $('#parent').style.right = (R_ + pad) + 'px';
  $('#parent').style.top = (TY + pad) + 'px';

  if (oTW > 0) for (const s of sprites) { s.x = TX + (s.x - oTX) / oTW * TW; s.y = TY + (s.y - oTY) / oTH * TH; }

// ---------- sand simulation ----------
let GW = 0, GH = 0, hA, rA, gA, bA, dA, tR, tG, tB, texA, texB;

const cellPx = () => TW / GW;
const toGrid = (x, y) => [(x - TX) / TW * GW - 0.5, (y - TY) / TH * GH - 0.5];
function sandColorAt(x, y) {

let T = 0, last = performance.now(), peekTimer = 2.5, ambT = 0, lastCount = -1;
